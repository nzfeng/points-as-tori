name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-64
            runner: ubuntu-24.04
          - platform: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.70.1
          cache: true
          frozen: true
      - run: pixi run check
